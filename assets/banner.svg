<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AIBuddy - one click to every AI tool">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#7a3cff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7a3cff" stroke-opacity="0.2"/>
    </pattern>
    <radialGradient id="pinkGlow" cx="0.1" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.95" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#07040f"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#pinkGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="320" fill="url(#blueGlow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- glitch layers -->
    <text x="600" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="800" fill="#ff2bd6" opacity="0.75">
      AIBuddy
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 0;5 -2;0 0;0 0;0 0" keyTimes="0;0.7;0.74;0.78;0.82;0.9;1" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="800" fill="#00e5ff" opacity="0.75">
      AIBuddy
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 0;-5 2;0 0;0 0;0 0" keyTimes="0;0.7;0.74;0.78;0.82;0.9;1" dur="3.4s" repeatCount="indefinite"/>
    </text>

    <!-- main title -->
    <text x="600" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="800" fill="url(#neon)" filter="url(#glow)">
      AIBuddy
      <animate attributeName="opacity" values="1;0.88;1;0.94;1" dur="2.6s" repeatCount="indefinite"/>
    </text>

    <!-- rotating taglines -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#00e5ff" text-anchor="middle" filter="url(#glow)">
      <text x="600" y="224" opacity="0">&gt; one click to every AI tool_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="224" opacity="0" fill="#ff2bd6">&gt; add. remove. customize._
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="224" opacity="0">&gt; no signup. no tracking. just launch._
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- status strip -->
    <text x="600" y="282" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#a392c9" letter-spacing="3">
      CHROME MV3  //  100% LOCAL  //  NEON MODE ONLINE
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- scanline -->
    <rect x="0" y="-12" width="1200" height="10" fill="#ffffff" opacity="0.06">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated neon border -->
  <rect x="3" y="3" width="1194" height="314" rx="12" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="260 140" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-400" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00e5ff" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M24 56V24H56"/>
    <path d="M1144 24H1176V56"/>
    <path d="M24 264V296H56"/>
    <path d="M1144 296H1176V264"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </g>
</svg>
