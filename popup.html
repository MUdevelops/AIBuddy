<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIBuddy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="scan"></div>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="logo" />
        <div>
          <h1>AI<span>Buddy</span></h1>
          <p>Your AI tools, one click away</p>
        </div>
      </div>
      <div class="actions">
        <button id="editBtn" class="chip" title="Add or remove buttons" aria-pressed="false">Edit</button>
      </div>
    </header>

    <section id="grid" class="grid" aria-label="AI tools"></section>

    <section id="editPanel" class="panel" hidden>
      <h2>Add a custom link</h2>
      <div class="row">
        <input id="nameInput" type="text" placeholder="Name (e.g. Suno)" maxlength="18" autocomplete="off" />
        <input id="urlInput" type="text" placeholder="URL (e.g. suno.com)" autocomplete="off" />
      </div>
      <div class="row">
        <button id="addBtn" class="btn pink">Add button</button>
        <button id="resetBtn" class="btn ghost">Reset to defaults</button>
      </div>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <footer class="foot">
      <a id="starBtn" class="star" href="https://github.com/MUdevelops/AIBuddy" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
        Star the repo on GitHub
      </a>
      <span class="credit">MUdevelops/AIBuddy</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
